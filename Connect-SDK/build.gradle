apply plugin: 'com.android.library'

android {

    compileSdk 34
    namespace = "com.connectsdk"
    packagingOptions {
        resources {
            excludes += ['LICENSE.txt', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }

    useLibrary 'org.apache.http.legacy'

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [
                    'src',
                    'core/src',
                    'modules/google_cast/src'
            ]
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        androidTest {
            java.srcDirs = [
                    'core/test/src',
                    'modules/google_cast/test/src'
            ]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles("consumer-rules.pro")
        }
    }
}

dependencies {
    // implementation files('libs/Java-WebSocket-1.3.7.jar')
    api files('libs/javax.jmdns_3.4.1-patch2.jar')
    api files('libs/AmazonFling.jar')
    api files('libs/WhisperPlay.jar')
    api files('libs/lgcast-android-lib.jar')
    //implementation files('libs/WhisperPlay.jar')

    //   implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.jar"))))


    /*  implementation 'com.android.support:support-v4:21.0.3'*/
    /*  implementation 'com.android.support:mediarouter-v7:21.0.3'*/
    /*  implementation 'com.android.support:appcompat-v7:21.0.3'*/

    /*  implementation 'com.google.android.gms:play-services-cast:19.0.0'*/


    implementation(project(":androidremote"))
    //implementation(files("/lib/androidremote1.aar"))
    //implementation(files("../libs/androidremote1.aar"))
//    implementation(fileTree(mapOf("dir" to "../libs", "include" to listOf("*.aar"))))


    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    // implementation 'javax.jmdns:jmdns:3.4.1'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'com.google.android.gms:play-services-cast:19.0.0'
    implementation 'com.googlecode.plist:dd-plist:1.23'
    implementation 'com.nimbusds:srp6a:2.1.0'
    implementation 'net.i2p.crypto:eddsa:0.3.0'


}
